<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="{{META_DESCRIPTION}}">
	<meta name="author" content="Maxim Gehricke">
	<meta name="title" content="Maxim Gehricke - {{TITLE}}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="../style.css" rel="stylesheet" type="text/css">
	<title>{{TITLE}} — Maxim Gehricke</title>
</head>

<body class="bg">
	<header>
		<a href="https://maximgehricke.com" class="font1" id="logo">MAXIM GEHRICKE</a>
		<nav id="menunav" class="menu">
			<ul id="menuul">
				<li><a class="font1" href="https://maximgehricke.com">Portfolio</a></li>
				<li><a class="font1" href="../index.html"
						style="color: transparent;text-shadow: 0 0 2px rgba(255,255,255,1);">Blog</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<article class="blog-post">
			<p class="blog-date font1">{{DATE}}</p>
			<h1 class="blog-title font1">{{TITLE}}</h1>
			<div class="blog-body font1">
				{{CONTENT}}
			</div>
		</article>
	</main>

	<footer id="footer">
		<p id="footertext" class="font2">
			&#9400 Maxim Gehricke 2026
		</p>
	</footer>

	<!-- 100% privacy-first analytics -->
	<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

</body>
</html>
