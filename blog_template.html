<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="{{META_DESCRIPTION}}">
	<meta name="author" content="Maxim Gehricke">
	<meta name="title" content="Maxim Gehricke - {{TITLE}}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="../style.css" rel="stylesheet" type="text/css">
	<title>{{TITLE}} — Maxim Gehricke</title>
</head>

<body class="bg">
	<main class="blog-layout">
		<aside class="blog-sidebar">
			<a href="../index.html" class="font1" id="logo">Maxim's Blog</a>
			<h2 class="font1 blog-subheading">Posts</h2>
			<ul class="blog-tree" id="blog-tree">
				{{SIDEBAR_POSTS}}
			</ul>
		</aside>

		<article class="blog-post">
			<p class="blog-date font1">{{DATE}}</p>
			<h1 class="blog-title font1">{{TITLE}}</h1>
			<div class="blog-body font1">
				{{CONTENT}}
			</div>
		</article>
	</main>

	<footer id="footer">
		<p id="footertext" class="font2">
			&#9400 Maxim Gehricke 2026
		</p>
	</footer>

	<!-- 100% privacy-first analytics -->
	<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

</body>

</html>
